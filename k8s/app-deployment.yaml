apiVersion: apps/v1
kind: Deployment

metadata:
  name: device-booking-app

spec:
  replicas: 1

  selector:
    matchLabels:
      app: device-booking-app

  template:
    metadata:
      labels:
        app: device-booking-app

    spec:
      containers:

        - name: device-booking-app

          image: device-booking-app:0

          ports:
            - containerPort: 8080

          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres-service:5432/device_booking

            - name: SPRING_DATASOURCE_USERNAME
              value: postgres

            - name: SPRING_DATASOURCE_PASSWORD
              value: postgres